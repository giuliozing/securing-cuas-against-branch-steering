[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobra"
version = "1.0.0"
description = "COBRA: cross-channel constraint integrity (CFI + DFI) for computer-use agents combining GUI web interaction and MCP tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "agentdojo>=0.1.34",
    "anthropic>=0.51.0",
    "pydantic>=2.11.4",
    "pydantic-ai>=0.2.4",
    "tiktoken>=0.9.0",
    "google-genai>=1.15.0",
    "openai>=1.78.1",
    "jsonref>=1.1.0",
    "openapi-pydantic>=0.5.1",
    "PyYAML",
]

[project.optional-dependencies]
# The MCP proxy: fastmcp is used both to speak MCP and by the interaction
# layer's tool bridges.
mcp = ["fastmcp>=2.13.0.2"]
# The HTTP proxy (mitmproxy addon) and its approval UI.
http_proxy = ["mitmproxy>=10.0", "ttkbootstrap>=1.10", "InquirerPy>=0.3", "flask>=3.0"]
# The Q-VLM interaction layer against a live OSWorld VM (github.com/xlang-ai/OSWorld);
# not required to use the BRH / proxies / interpreter on their own.
osworld = ["pyautogui>=0.9.54", "wrapt-timeout-decorator>=1.5.1"]
dev = ["pytest>=8.3.3", "aiohttp>=3.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/cobra"]
